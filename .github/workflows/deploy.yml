name: Deploy Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastfood-ai-assistant-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.151.3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 75117653077f5d62992ef290c1f780d7
